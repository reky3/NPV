<!DOCTYPE html>
<html lang="sk">
<head>
<meta charset="UTF-8">
<title>Weather App</title>
<style>
        body{
            font-family: Arial, Helvetica, sans-serif;
            background:#f4f4f4;
            margin:40px;
        }
        .container{
            width:900px;
            margin:auto;
            background:white;
            padding:20px;
            border-radius:10px;
            box-shadow:0 0 10px rgba(0,0,0,.2);
        }
        h1{
            text-align:center;
        }
        form{
            display:flex;
            justify-content:center;
            gap:10px;
            margin-bottom:25px;
        }
        input{
            padding:10px;
            width:250px;
            font-size:16px;
        }
        button{
            padding:10px 20px;
            font-size:16px;
            cursor:pointer;
        }
        table{
            width:100%;
            border-collapse:collapse;
        }
        th, td{
            border:1px solid #ddd;
            padding:10px;
            text-align:center;
        }
        th{
            background:#4285f4;
            color:white;
        }
        tr:nth-child(even){
            background:#f9f9f9;
        }
</style>
</head>
<body>
<div class="container">
<h1>🌤 Weather App</h1>
<form action="/add" method="POST">
<input
        type="text"
        name="mesto"
        placeholder="Zadaj mesto..."
        required>
<button type="submit">
        Získať počasie
</button>
</form>
<table>
<tr>
<th>ID</th>
<th>Mesto</th>
<th>Teplota (°C)</th>
<th>Vlhkosť (%)</th>
<th>Počasie</th>
<th>Dátum</th>
</tr>
    {% for row in data %}
<tr>
<td>{{ row[0] }}</td>
<td>{{ row[1] }}</td>
<td>{{ row[2] }}</td>
<td>{{ row[3] }}</td>
<td>{{ row[4] }}</td>
<td>{{ row[5] }}</td>
</tr>
    {% endfor %}
</table>
</div>
</body>
</html>
